<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" aria-hidden="true">
<defs>
<radialGradient id="ground" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#1d232b"/><stop offset="1" stop-color="#11151a"/></radialGradient>
<radialGradient id="psr" cx=".5" cy=".55" r=".55"><stop offset="0" stop-color="#14181c"/><stop offset=".7" stop-color="#090c10"/><stop offset="1" stop-color="#0b0e12"/></radialGradient>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0 V6" stroke="#2a323d" stroke-width="1"/></pattern>
</defs>
<rect width="600" height="600" fill="#0d1014"/>
<circle cx="300" cy="300" r="292" fill="url(#ground)"/>
<!-- maria / basalt patches -->
<path d="M70 380 q30 -40 90 -30 q50 10 60 50 q5 50 -50 70 q-60 15 -95 -20 q-25 -30 -5 -70z" fill="#181d24" stroke="#262e38"/>
<path d="M110 120 q40 -25 85 -5 q35 20 20 55 q-20 30 -70 25 q-45 -8 -45 -40 q0 -20 10 -35z" fill="#181d24" stroke="#262e38"/>
<!-- highland shelf -->
<path d="M420 400 q50 -20 95 15 q25 35 -5 70 q-40 30 -85 10 q-35 -20 -30 -55 q3 -25 25 -40z" fill="url(#hatch)" stroke="#33404e"/>
<!-- ridge -->
<path d="M270 400 q40 -30 80 -20 q40 10 70 -10" fill="none" stroke="#3d4856" stroke-width="10" stroke-linecap="round"/>
<path d="M270 396 q40 -30 80 -20 q40 10 70 -10" fill="none" stroke="#f2a93b" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
<!-- craters (permanently shadowed floors) -->
<circle cx="250" cy="285" r="62" fill="url(#psr)" stroke="#3a4554" stroke-width="2"/>
<circle cx="250" cy="285" r="62" fill="none" stroke="#8e969d" stroke-opacity=".18" stroke-width="10"/>
<circle cx="385" cy="205" r="40" fill="url(#psr)" stroke="#3a4554" stroke-width="2"/>
<circle cx="385" cy="205" r="40" fill="none" stroke="#8e969d" stroke-opacity=".12" stroke-width="8"/>
<g fill="none" stroke="#2f3946" stroke-width="1.5">
<circle cx="470" cy="300" r="18"/><circle cx="200" cy="470" r="14"/><circle cx="330" cy="500" r="22"/><circle cx="480" cy="140" r="12"/><circle cx="90" cy="270" r="16"/><circle cx="300" cy="90" r="20"/>
</g>
<!-- graticule -->
<g fill="none" stroke="#dcd9d1" stroke-opacity=".14" stroke-dasharray="3 6">
<circle cx="300" cy="300" r="95"/><circle cx="300" cy="300" r="190"/><circle cx="300" cy="300" r="285"/>
<path d="M300 15 V585 M15 300 H585 M98 98 L502 502 M502 98 L98 502"/>
</g>
<path d="M294 300 h12 M300 294 v12" stroke="#dcd9d1" stroke-width="1.5"/>
<g font-family="system-ui,sans-serif" font-size="11" fill="#7d8896">
<text x="306" y="212">88°S</text><text x="306" y="117">86°S</text><text x="306" y="27">84°S</text>
<text x="300" y="12" text-anchor="middle" font-weight="700" fill="#a3afbd">0°</text>
</g>
</svg>
